services:
  backend:
    build: .
    container_name: house-price-backend
    env_file:
      - .env
    volumes:
      - ./data/User_Database.db:/app/User_Database.db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: .
    container_name: house-price-frontend
    command: streamlit run Frontend_House_Price_Prediction/frontend_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped